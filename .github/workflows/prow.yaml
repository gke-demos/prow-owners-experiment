name: Prow
on:
  issues:
    types: [opened, reopened, labeled, unlabeled]
  issue_comment:
    types: [created]
  # Safe because neither job checks out or executes PR head code:
  # - check-ready-issue checks out the base branch (main) only.
  # - prow checks out cncf/prow-github-actions at the pinned SHA and reads
  #   OWNERS strictly from main.
  pull_request_target:
    types: [opened, reopened, edited, synchronize, ready_for_review, labeled, unlabeled]
  pull_request_review:
    types: [submitted, dismissed]
  merge_group:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/prow.yaml]

permissions:
  contents: write
  issues: write
  pull-requests: write
  statuses: write
  actions: write

concurrency:
  group: prow-${{ github.event_name }}-${{ github.event.action }}-${{ github.event.comment.id || github.event.pull_request.number || github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  check-ready-issue:
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       contains(github.event.comment.body, '/reopen'))
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    outputs:
      allowed: ${{ steps.verify.outputs.allowed }}
    steps:
      - name: Checkout base branch scripts only
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.repository.default_branch }}
          persist-credentials: false
      - name: Verify linked ready-for-pr issue
        id: verify
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          REOPEN_ATTEMPT: ${{ github.event_name == 'issue_comment' }}
        run: .github/scripts/prow/check-ready-issue.sh

  prow:
    needs: [check-ready-issue]
    if: >-
      always() &&
      github.event_name != 'workflow_dispatch' &&
      github.event_name != 'push' &&
      github.event_name != 'merge_group' &&
      (needs.check-ready-issue.result == 'skipped' ||
       (needs.check-ready-issue.result == 'success' && needs.check-ready-issue.outputs.allowed == 'true'))
    uses: cncf/prow-github-actions/.github/workflows/prow.yml@a192ee15687d4ede4d553ff0929b2b296666afd7 # v3.5.0
    with:
      prow-commands: /assign /unassign /cc /uncc /auto-cc /approve /lgtm /hold /close /reopen /lock /retitle /milestone /remove /area /kind /prio /triage /label /lifecycle /stage /status /help /good-first-issue /check-required-labels /retest /test /ok-to-test /label-sync

  label-sync:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    uses: cncf/prow-github-actions/.github/workflows/prow.yml@a192ee15687d4ede4d553ff0929b2b296666afd7 # v3.5.0
    with:
      jobs: label-sync

  merge-queue-status:
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Pass prow/lgtm on temporary Merge Queue commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.event.merge_group.head_sha }}
        run: .github/scripts/prow/pass-merge-group-lgtm.sh
